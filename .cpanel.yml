---
# cPanel Git Version Control deployment (runs after "Deploy HEAD Commit").
# Copies ONLY the public home page and its assets to the web root.
# Nothing else in the repo (page/, inc/, config/, sql/, data/) is published.
# Replace CPANELUSER with the real cPanel account name before first deploy.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/public_html/
    - /bin/cp index_live.php $DEPLOYPATH/index.php
    - /bin/cp favicon.ico $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/css $DEPLOYPATH/js $DEPLOYPATH/img $DEPLOYPATH/docs
    - /bin/cp css/bootstrap.min.css css/style.css css/print.css $DEPLOYPATH/css/
    - /bin/cp js/bootstrap.bundle.min.js $DEPLOYPATH/js/
    - /bin/cp img/U3A_Logo.jpg img/parked-bg.jpg img/U3A_PortAlfred_Committee_2024_v2.jpg $DEPLOYPATH/img/
    - /bin/cp docs/U3A_Mem_Appl_20230317.pdf $DEPLOYPATH/docs/
